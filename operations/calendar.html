<body data-page="calendar" data-crumb="العمل|التقويم">
<main class="content">
  <div class="page-head"><div><h1>المواعيد والتسليمات</h1><p>اجتماعات العملاء ومواعيد التسليم والمهام المستحقة في عرض شهري.</p></div><div class="actions"><a class="btn btn-primary" href="event-new.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>موعد جديد</a></div></div>

    <div class="card"><div class="card-head"><h2 id="monthLabel"></h2><div class="row"><button class="btn btn-sm btn-secondary" id="prev" aria-label="الشهر السابق">›</button><button class="btn btn-sm btn-secondary" id="todayBtn">اليوم</button><button class="btn btn-sm btn-secondary" id="next" aria-label="الشهر التالي">‹</button></div></div>

      <div class="cal" id="cal"></div></div>
    <div class="card" style="align-self:start"><div class="card-head"><h2>القادم</h2></div><div class="card-body" id="agenda"></div></div>
  </section>
