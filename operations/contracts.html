<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>العقود · Connect Webia</title>
<link rel="icon" type="image/svg+xml" href="assets/brand/logo-mark.svg">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-page="contracts" data-crumb="العملاء والخدمات|العقود">
<main class="content">
  <div class="page-head"><div><h1>العقود</h1><p>متابعة قيم العقود ومواعيد التجديد.</p></div><div class="actions"><span class="sample-note">بيانات تجريبية — تُستبدل عند ربط الـ API</span><a class="btn btn-primary" href="contract-form.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>عقد جديد</a></div></div>
  <section class="grid grid-3">
    <div class="card kpi"><div class="kpi-top"><span>قيمة العقود السارية</span></div><div class="kpi-value" id="kTotal" style="font-size:var(--fs-2xl)"></div></div>
    <div class="card kpi"><div class="kpi-top"><span>عقود سارية</span></div><div class="kpi-value" id="kCount"></div></div>
    <div class="card kpi is-alert"><div class="kpi-top"><span>تحتاج تجديد أو تنتهي قريباً</span></div><div class="kpi-value" id="kRenew"></div></div>
  </section>
  <section class="card">
  <div class="toolbar"><label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="q" type="search" placeholder="ابحث بالعقد أو العميل" aria-label="بحث"></label><button type="button" class="chip-filter" data-filter="all" aria-pressed="true">الكل</button><button type="button" class="chip-filter" data-filter="active" aria-pressed="false">سارية</button><button type="button" class="chip-filter" data-filter="renewal" aria-pressed="false">بانتظار التجديد</button><button type="button" class="chip-filter" data-filter="ending" aria-pressed="false">تنتهي قريباً</button><button type="button" class="chip-filter" data-filter="draft" aria-pressed="false">مسودات</button></div>
  <div id="list"></div>
</section>
</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/pages/admin.js"></script>
</body>
</html>
