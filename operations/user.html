<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حساب الموظف · Connect Webia</title>
<link rel="icon" type="image/svg+xml" href="assets/brand/logo-mark.svg">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-page="user" data-crumb="المستخدمون|حساب الموظف" data-nav="users">
<main class="content">
  <div class="page-head"><div class="row" id="uHead"></div><div class="actions"><a class="btn btn-secondary" href="employees.html">الموظفون</a></div></div>
  <section class="grid grid-main">
    <form class="card" id="userForm" data-resource="employees" novalidate>
      <div class="card-body form-grid">
        <div class="form-section">البيانات الشخصية</div>
        <div class="field"><label for="name">الاسم الكامل <span class="req">*</span></label><input class="input" id="name" name="name" required></div>
        <div class="field"><label for="title">المسمى الوظيفي</label><input class="input" id="title" name="title"></div>
        <div class="field"><label for="email">البريد الإلكتروني <span class="req">*</span></label><input class="input" id="email" name="email" type="email" required dir="ltr"></div>
        <div class="field"><label for="phone">الهاتف</label><input class="input" id="phone" name="phone" dir="ltr"></div>
        <div class="form-section">الدور والوصول</div>
        <div class="field"><label for="role">الدور</label><select class="select" id="role" name="role"><option value="employee">موظف</option><option value="ops">مدير التشغيل</option><option value="ceo">الرئيس التنفيذي</option></select></div>
        <div class="field"><label for="deptSel">القسم</label><select class="select" id="deptSel" name="dept" data-source="departments"><option value="">الإدارة العامة</option></select></div>
        <div class="field"><label for="status">الحالة</label><select class="select" id="status" name="status"><option value="active">على رأس العمل</option><option value="leave">إجازة</option></select></div>
      </div>
      <div class="form-foot"><button class="btn btn-danger" type="button" onclick="CW.ui.toast('تم إيقاف الحساب (تجريبي)')">إيقاف الحساب</button><button class="btn btn-primary" type="submit">حفظ التعديلات</button></div>
    </form>
    <div class="card" style="align-self:start"><div class="card-head"><h2>الأداء</h2></div><div class="card-body stat-list" id="uStats"></div></div>
  </section>
</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/pages/admin.js"></script>
</body>
</html>
